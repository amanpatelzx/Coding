<html>
    <head>
        <title>This is FOrm making</title>
    </head>
    <body>
        <h1>This is my first table</h1>
        <div>
            <label for="username">Enter your Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your Username">
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <input type="checkbox" name="subscribe" id="subscribe" value="yes">
            <label for="subscribe">Subscribe for Newspaper</label>
        </div>
        <div>
            <label for="comment">Enter Your Comment</label>
            <br>
            <textarea name="comment" id="comment" rows="4" cols="10">Write Your valuable though</textarea>
        </div>
        <div>
            <select name="fruits" id="fruits">
                <option value="apple">Apple</option>
                <option value="grapes">Grapes</option>
                <option value="banana">Banana</option>
            </select>
        </div>
        <p>This is <em>important</em> information.</p>

    </body>
</html>
